name: Fix diagnostic SEO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diagnostic canonical and og:url
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('https://hiremenow-diagnostic-v2.pages.dev/', 'https://diagnostic.hiremenowresumes.ca/')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No diagnostic SEO changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix diagnostic canonical and og url"
          git push
